[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-turn-dialogue-evaluation"
version = "0.1.0"
description = "Local multi-turn dialogue simulation and evaluation toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pydantic-settings>=2.5.2",
    "pytest>=8.3.3",
    "typer>=0.12.5",
    "uvicorn>=0.30.6",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
dialogue-eval = "dialogue_eval.cli:app"
dialogue-eval-desktop = "desktop_app:main"

[tool.setuptools.packages.find]
include = ["dialogue_eval*"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
